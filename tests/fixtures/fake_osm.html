<!doctype html>
<html lang="en"><head><title>Offline OSM fixture</title></head>
<body><main id="map"><h1>Offline OSM fixture</h1></main>
<a href="/directions" title="Find directions between two points"
   onclick="showDirections(); return false;">Directions</a>
<form hidden onsubmit="return false">
  <input type="radio" id="modes_car" name="mode" value="car" style="display:none">
  <label title="Car" for="modes_car">Car</label>
  <input placeholder="From" id="route_from">
  <input placeholder="To" id="route_to">
</form>
<section id="sidebar_content"><table id="route-summary" hidden>
  <tbody><tr><td>Hamburg to Berlin</td><td><span id="route-duration">2:45</span></td></tr></tbody>
</table></section>
<script>
function showDirections() {
  document.querySelector('form').hidden = false;
  setTimeout(() => {
    window.formReady = true;
    const marker = document.createElement('div');
    marker.id = 'directions-ready';
    document.body.appendChild(marker);
  }, 50);
}
document.querySelector('#route_to').addEventListener('keydown', event => {
  if(event.key === 'Enter') {
    event.preventDefault();
    if(!window.formReady) return;
    document.querySelector('#route_from').value = 'Hamburg, Germany';
    document.querySelector('#route_to').value = 'Berlin, Germany';
    document.querySelector('#route-summary').hidden = false;
  }
});
</script></body></html>
