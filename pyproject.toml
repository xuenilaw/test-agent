[project]
name = "test-agent"
version = "0.1.0"
description = "Learn Playwright first, then expose browser tools to an agent."
requires-python = ">=3.11"
dependencies = ["playwright", "openai-agents", "python-dotenv", "openpyxl", "pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_agent"]
